server:
  framework: vllm
  host: 0.0.0.0
  port: 8000

model:
  model_path: Agnania/EviNurse-32B
  served_model_name: EviNurse
  tensor_parallel_size: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.90

rag:
  enabled: true
  mode: dual
  base_url: http://127.0.0.1:50002
  source_endpoint: /retrieve_sources
  passage_endpoint: /retrieve_passages
  endpoint: /getReference
  top_k_sources: 5
  top_k_passages: 5

links:
  dataset: https://huggingface.co/datasets/Agnania/NursData-MCQ
  model: https://huggingface.co/Agnania/EviNurse-32B
  code: https://github.com/Creeper12345/EviNurse.git
